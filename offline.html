<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Tata College Student Hub</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --text-main: #f8fafc;
      --primary: #6366f1;
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 2rem;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    svg {
      width: 80px;
      height: 80px;
      color: var(--primary);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 1rem 0;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0 0 1.5rem 0;
    }
    button {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-3.536 4.978 4.978 0 011.414-3.536m0 0L4.243 4.243M11 7a4 4 0 010 8m0-8l-2.829-2.829M11 15l2.829 2.829" />
    </svg>
    <h1>You are Offline</h1>
    <p>It seems you don't have an active internet connection right now. Some resources may not be loadable, but you can still access previously viewed and saved data from your dashboard!</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
